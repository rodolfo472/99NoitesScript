<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jogos2D Studio</title>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: Arial;
  background: #1e1e1e;
  color: white;
}

/* Sidebar */
#sidebar {
  width: 200px;
  background: #2b2b2b;
  padding: 10px;
  overflow-y: auto;
}

#sidebar h3 {
  margin-top: 0;
}

/* Game Area */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

#game {
  flex: 1;
  background: #111;
  position: relative;
}

.obj {
  position: absolute;
}

/* Explorer */
#explorer {
  font-size: 13px;
}

/* Bottom Console */
#console {
  height: 150px;
  background: black;
  overflow-y: auto;
  padding: 5px;
  font-size: 12px;
}

#input {
  display: flex;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
}
button {
  padding: 10px;
  background: #444;
  color: white;
  border: none;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3>🧰 Toolbox</h3>
  <button onclick="create('block')">Bloco</button>
  <button onclick="create('npc')">NPC Jorge</button>
  <button onclick="create('player')">Player</button>

  <h3>📦 Explorer</h3>
  <div id="explorer"></div>
</div>

<div id="main">
  <div id="game"></div>

  <div id="console"></div>

  <div id="input">
    <input id="cmd" placeholder="Digite comando... (ex: criar bloco)">
    <button onclick="run()">Enviar</button>
  </div>
</div>

<script>
let game = document.getElementById("game")
let consoleBox = document.getElementById("console")
let explorer = document.getElementById("explorer")
let cmd = document.getElementById("cmd")

let objs = []
let id = 0

function log(msg){
  consoleBox.innerHTML += msg + "<br>"
  consoleBox.scrollTop = consoleBox.scrollHeight
}

function updateExplorer(){
  explorer.innerHTML = ""
  objs.forEach(o=>{
    explorer.innerHTML += "• " + o.name + "<br>"
  })
}

function create(type){
  let el = document.createElement("div")
  el.classList.add("obj")

  let obj = {id: id++, el: el}

  if(type === "block"){
    el.style.width = "50px"
    el.style.height = "50px"
    el.style.background = "blue"
    obj.name = "Bloco"
  }

  if(type === "npc"){
    el.style.width = "40px"
    el.style.height = "40px"
    el.style.background = "green"
    obj.name = "Jorge"
  }

  if(type === "player"){
    el.style.width = "40px"
    el.style.height = "40px"
    el.style.background = "red"
    obj.name = "Player"
  }

  el.style.left = Math.random()*300 + "px"
  el.style.top = Math.random()*200 + "px"

  game.appendChild(el)
  objs.push(obj)

  updateExplorer()
  log("Criado: " + obj.name)
}

function run(){
  let text = cmd.value.toLowerCase()

  if(text.includes("bloco")) create("block")
  else if(text.includes("jorge")) create("npc")
  else if(text.includes("player")) create("player")
  else log("Comando não reconhecido")

  cmd.value = ""
}
</script>

</body>
</html>
